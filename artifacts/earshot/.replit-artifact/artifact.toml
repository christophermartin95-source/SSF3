kind = "web"
previewPath = "/"
title = "SSF"
version = "1.0.0"
id = "artifacts/earshot"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23550

[services.development]
run = "pnpm --filter @workspace/earshot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/earshot", "run", "build" ]
publicDir = "artifacts/earshot/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23550"
BASE_PATH = "/"
