openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: realtime
    description: Realtime connection operations
  - name: users
    description: User profile and presence operations
  - name: media
    description: Media clip operations
  - name: live
    description: Live audio session operations
  - name: messaging
    description: Direct messaging operations
  - name: storage
    description: Object storage operations
  - name: billing
    description: Stripe billing and archive-access operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /realtime/ticket:
    get:
      operationId: getRealtimeTicket
      tags: [realtime]
      summary: Issue a short-lived ticket used to authenticate the WebSocket connection
      responses:
        "200":
          description: Realtime ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeTicket"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile (JIT-provisions on first call)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/username-availability:
    get:
      operationId: checkUsernameAvailability
      tags: [users]
      summary: Check if a username / user ID is available
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Availability result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsernameAvailability"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List/search users
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/online:
    get:
      operationId: listOnlineUsers
      tags: [users]
      summary: List currently online users and which section of the app they're in
      responses:
        "200":
          description: Online users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PresenceEntry"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a public user profile with follow stats
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/{userId}/follow:
    post:
      operationId: toggleFollow
      tags: [users]
      summary: Follow or unfollow a user (toggle)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated follow status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowStatus"

  /users/{userId}/followers:
    get:
      operationId: listFollowers
      tags: [users]
      summary: List users who follow this user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Followers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{userId}/following:
    get:
      operationId: listFollowing
      tags: [users]
      summary: List users this user follows
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Following
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{userId}/favorites:
    get:
      operationId: listUserFavorites
      tags: [users]
      summary: List a user's favourited (bookmarked) clips
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The user's favourited clips, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaClip"

  /users/{userId}/likes:
    get:
      operationId: listUserLikes
      tags: [users]
      summary: List a user's liked clips
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The user's liked clips, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaClip"

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all users (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /admin/users/{userId}/role:
    patch:
      operationId: adminSetUserRole
      tags: [admin]
      summary: Set a user's role (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSetUserRoleInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/stats:
    get:
      operationId: adminGetStats
      tags: [admin]
      summary: Site-wide stats for the admin dashboard
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                type: object
                required: [userCount, mediaCount, liveSessionCount, commentCount]
                properties:
                  userCount:
                    type: integer
                  mediaCount:
                    type: integer
                  liveSessionCount:
                    type: integer
                  commentCount:
                    type: integer

  /admin/media/{mediaId}:
    patch:
      operationId: adminUpdateMedia
      tags: [admin]
      summary: Move a media clip to a different section (admin only)
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateMediaInput"
      responses:
        "200":
          description: Updated media clip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaClip"
    delete:
      operationId: adminDeleteMedia
      tags: [admin]
      summary: Delete any media clip (admin only)
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/comments/{commentId}:
    delete:
      operationId: adminDeleteComment
      tags: [admin]
      summary: Delete any comment (admin only)
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/live/{sessionId}:
    delete:
      operationId: adminDeleteLiveSession
      tags: [admin]
      summary: End and delete any live session (admin only)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /media:
    get:
      operationId: listMedia
      tags: [media]
      summary: List media clips, optionally filtered by section
      parameters:
        - name: section
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MediaSection"
        - name: userId
          in: query
          required: false
          schema:
            type: string
        - name: archived
          in: query
          required: false
          description: When true, return only clips older than the 3-month archive cutoff (requires an active archive subscription). Defaults to false (only recent clips).
          schema:
            type: boolean
        - name: search
          in: query
          required: false
          description: Case-insensitive search on clip title. Matches clips whose title contains this text.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort order for results. "newest" (default) and "oldest" sort by upload date; "popular" sorts by like count.
          schema:
            type: string
            enum: [newest, popular, oldest]
      responses:
        "200":
          description: List of media clips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaClip"
    post:
      operationId: createMedia
      tags: [media]
      summary: Create a media clip record after uploading the file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaInput"
      responses:
        "201":
          description: Created media clip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaClip"

  /media/favorite-of-month:
    get:
      operationId: getMediaFavoriteOfMonth
      tags: [media]
      summary: The top-voted clip this calendar month for a section (by likes + comments), if any
      parameters:
        - name: section
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MediaSection"
      responses:
        "200":
          description: Favorite clip of the month, or null if no clips this month
          content:
            application/json:
              schema:
                type: object
                nullable: true
                required:
                  [
                    id,
                    userId,
                    username,
                    title,
                    section,
                    audioFormat,
                    objectPath,
                    likeCount,
                    playCount,
                    likedByMe,
                    favoritedByMe,
                    commentCount,
                    score,
                    createdAt,
                  ]
                properties:
                  id:
                    type: integer
                  userId:
                    type: string
                  username:
                    type: string
                  avatarUrl:
                    type: ["string", "null"]
                  title:
                    type: string
                  description:
                    type: ["string", "null"]
                  section:
                    $ref: "#/components/schemas/MediaSection"
                  audioFormat:
                    type: string
                  objectPath:
                    type: string
                  thumbnailPath:
                    type: ["string", "null"]
                  durationSeconds:
                    type: ["number", "null"]
                  likeCount:
                    type: integer
                  playCount:
                    type: integer
                  likedByMe:
                    type: boolean
                  favoritedByMe:
                    type: boolean
                  commentCount:
                    type: integer
                  score:
                    type: integer
                  createdAt:
                    type: string
                    format: date-time

  /media/feed/recent:
    get:
      operationId: getRecentActivity
      tags: [media]
      summary: Recent activity feed across both sections
      responses:
        "200":
          description: Recent media clips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaClip"

  /media/stats/summary:
    get:
      operationId: getMediaStatsSummary
      tags: [media]
      summary: Dashboard summary of clip counts per section and top uploaders
      responses:
        "200":
          description: Media stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaStatsSummary"

  /media/favorites:
    get:
      operationId: listMediaFavorites
      tags: [media]
      summary: List the current user's favourited (bookmarked) clips
      responses:
        "200":
          description: The current user's favourited clips, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaClip"

  /media/{mediaId}:
    get:
      operationId: getMedia
      tags: [media]
      summary: Get a single media clip
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Media clip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaClip"
    delete:
      operationId: deleteMedia
      tags: [media]
      summary: Delete a media clip (owner only)
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /media/{mediaId}/like:
    post:
      operationId: toggleMediaLike
      tags: [media]
      summary: Toggle a like on a media clip
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated media clip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaClip"

  /media/{mediaId}/favorite:
    post:
      operationId: toggleMediaFavorite
      tags: [media]
      summary: Toggle whether the current user has favourited (bookmarked) a clip
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated media clip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaClip"

  /media/{mediaId}/play:
    post:
      operationId: recordMediaPlay
      tags: [media]
      summary: Record a play event for a media clip
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated media clip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaClip"

  /live/sessions:
    get:
      operationId: listLiveSessions
      tags: [live]
      summary: List live audio sessions
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LiveSessionStatus"
        - name: archived
          in: query
          required: false
          description: When true, return only sessions older than the 3-month archive cutoff (requires an active archive subscription). Defaults to false (only recent sessions).
          schema:
            type: boolean
      responses:
        "200":
          description: List of live sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiveSession"
    post:
      operationId: createLiveSession
      tags: [live]
      summary: Start a new live audio session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveSessionInput"
      responses:
        "201":
          description: Created live session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"

  /live/sessions/{sessionId}:
    get:
      operationId: getLiveSession
      tags: [live]
      summary: Get a live session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Live session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
    patch:
      operationId: updateLiveSession
      tags: [live]
      summary: Update a live session (e.g. end it, change title)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveSessionUpdate"
      responses:
        "200":
          description: Updated live session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"

  /live/sessions/{sessionId}/join:
    post:
      operationId: joinLiveSession
      tags: [live]
      summary: Join a live session as a listener
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated live session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"

  /live/sessions/{sessionId}/leave:
    post:
      operationId: leaveLiveSession
      tags: [live]
      summary: Leave a live session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated live session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"

  /media/{mediaId}/comments:
    get:
      operationId: listMediaComments
      tags: [media]
      summary: List comments on a media clip
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createMediaComment
      tags: [media]
      summary: Add a comment to a media clip
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /live/sessions/{sessionId}/comments:
    get:
      operationId: listLiveSessionComments
      tags: [live]
      summary: List comments on a live session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createLiveSessionComment
      tags: [live]
      summary: Add a comment to a live session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /comments/{commentId}:
    delete:
      operationId: deleteComment
      tags: [media]
      summary: Delete a comment (author only)
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /comments/{commentId}/upvote:
    post:
      operationId: toggleCommentUpvote
      tags: [media]
      summary: Toggle an upvote on a comment
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /comments/{commentId}/pin:
    post:
      operationId: toggleCommentPin
      tags: [media]
      summary: Toggle pinning a comment (target owner/host only; pinning unpins any other pinned comment on the same target)
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /conversations:
    get:
      operationId: listConversations
      tags: [messaging]
      summary: List conversations for the current user with last message preview
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"

  /conversations/{userId}/messages:
    get:
      operationId: listMessages
      tags: [messaging]
      summary: List direct messages exchanged with a specific user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DirectMessage"
    post:
      operationId: sendMessage
      tags: [messaging]
      summary: Send a direct message to a specific user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectMessage"

  /conversations/broadcast:
    post:
      operationId: broadcastMessage
      tags: [messaging]
      summary: Send a direct message to every other user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Broadcast result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastResult"

  /chat/messages:
    get:
      operationId: listChatMessages
      tags: [chat]
      summary: List recent messages in the community live chat room
      responses:
        "200":
          description: List of chat messages, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Post a message to the community live chat room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: Posted message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"

  /chat/read:
    post:
      operationId: markChatMessageRead
      tags: [chat]
      summary: Mark a chat message as read by the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageReadInput"
      responses:
        "201":
          description: Read receipt recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessageRead"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List the current user's notifications, newest first
      responses:
        "200":
          description: The current user's notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all of the current user's notifications as read
      responses:
        "204":
          description: Marked all as read

  /notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a single notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Marked as read

  /stripe/subscription:
    get:
      operationId: getArchiveSubscriptionStatus
      tags: [billing]
      summary: Check whether the current user has active archive access
      responses:
        "200":
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveSubscriptionStatus"

  /stripe/checkout:
    post:
      operationId: createArchiveCheckoutSession
      tags: [billing]
      summary: Create a Stripe checkout session for archive access
      responses:
        "200":
          description: Checkout session URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResult"

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlInput"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MediaSection:
      type: string
      enum: [overheard, self_recorded]

    AdminUpdateMediaInput:
      type: object
      required: [section]
      properties:
        section:
          $ref: "#/components/schemas/MediaSection"

    LiveSessionStatus:
      type: string
      enum: [scheduled, live, ended]

    RealtimeTicket:
      type: object
      required: [ticket]
      properties:
        ticket:
          type: string

    UsernameAvailability:
      type: object
      required: [username, available]
      properties:
        username:
          type: string
        available:
          type: boolean

    NotificationType:
      type: string
      enum: [media_uploaded, media_liked, direct_message]

    Notification:
      type: object
      required: [id, type, read, createdAt]
      properties:
        id:
          type: integer
        type:
          $ref: "#/components/schemas/NotificationType"
        actorId:
          type: ["string", "null"]
        actorUsername:
          type: ["string", "null"]
        actorDisplayName:
          type: ["string", "null"]
        actorAvatarUrl:
          type: ["string", "null"]
        mediaId:
          type: ["integer", "null"]
        mediaTitle:
          type: ["string", "null"]
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    User:
      type: object
      required: [id, username, role, createdAt]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        bannerUrl:
          type: ["string", "null"]
        onboarded:
          type: string
          enum: ["true", "false"]
        role:
          $ref: "#/components/schemas/UserRole"
        createdAt:
          type: string
          format: date-time

    UserProfile:
      type: object
      required:
        [
          id,
          username,
          role,
          createdAt,
          followerCount,
          followingCount,
          clipCount,
          isFollowing,
          isSelf,
        ]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        bannerUrl:
          type: ["string", "null"]
        role:
          $ref: "#/components/schemas/UserRole"
        createdAt:
          type: string
          format: date-time
        followerCount:
          type: integer
        followingCount:
          type: integer
        clipCount:
          type: integer
        isFollowing:
          type: boolean
          description: True if the current viewer follows this user.
        isSelf:
          type: boolean
          description: True if this profile belongs to the current viewer.

    FollowStatus:
      type: object
      required: [following, followerCount, followingCount]
      properties:
        following:
          type: boolean
        followerCount:
          type: integer
        followingCount:
          type: integer

    UserRole:
      type: string
      enum: [user, admin]

    AdminSetUserRoleInput:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/UserRole"

    UserUpdate:
      type: object
      properties:
        username:
          type: string
        displayName:
          type: string
        bio:
          type: string
        avatarUrl:
          type: string
        bannerUrl:
          type: string
        onboarded:
          type: string
          enum: ["true", "false"]

    PresenceEntry:
      type: object
      required: [userId, username, status, section]
      properties:
        userId:
          type: string
        username:
          type: string
        displayName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [online, away]
        section:
          type: string
        lastSeenAt:
          type: string
          format: date-time

    MediaClip:
      type: object
      required:
        [
          id,
          userId,
          username,
          title,
          section,
          audioFormat,
          objectPath,
          likeCount,
          playCount,
          likedByMe,
          favoritedByMe,
          locked,
          createdAt,
        ]
      properties:
        id:
          type: integer
        userId:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: ["string", "null"]
        section:
          $ref: "#/components/schemas/MediaSection"
        audioFormat:
          type: ["string", "null"]
        objectPath:
          type: ["string", "null"]
        thumbnailPath:
          type: ["string", "null"]
          description: Object path of a generated poster image for video clips, if any. Null for audio clips or when locked.
        durationSeconds:
          type: ["number", "null"]
        likeCount:
          type: integer
        playCount:
          type: integer
        likedByMe:
          type: boolean
        favoritedByMe:
          type: boolean
          description: True if the current viewer has favourited (bookmarked) this clip.
        locked:
          type: boolean
          description: True if this clip is older than the archive cutoff and the viewer lacks archive access. When true, audioFormat/objectPath/thumbnailPath/durationSeconds are null.
        createdAt:
          type: string
          format: date-time

    MediaInput:
      type: object
      required: [title, section, audioFormat, objectPath]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        section:
          $ref: "#/components/schemas/MediaSection"
        audioFormat:
          type: string
        objectPath:
          type: string
        thumbnailPath:
          type: string
        durationSeconds:
          type: number

    MediaStatsSummary:
      type: object
      required: [totalClips, overheardCount, selfRecordedCount, topUploaders]
      properties:
        totalClips:
          type: integer
        overheardCount:
          type: integer
        selfRecordedCount:
          type: integer
        topUploaders:
          type: array
          items:
            $ref: "#/components/schemas/TopUploader"

    TopUploader:
      type: object
      required: [userId, username, clipCount]
      properties:
        userId:
          type: string
        username:
          type: string
        avatarUrl:
          type: ["string", "null"]
        clipCount:
          type: integer

    LiveSession:
      type: object
      required:
        [
          id,
          hostUserId,
          hostUsername,
          title,
          status,
          listenerCount,
          startedAt,
        ]
      properties:
        id:
          type: integer
        hostUserId:
          type: string
        hostUsername:
          type: string
        hostAvatarUrl:
          type: ["string", "null"]
        title:
          type: string
        status:
          $ref: "#/components/schemas/LiveSessionStatus"
        listenerCount:
          type: integer
        scheduledAt:
          type: ["string", "null"]
          format: date-time
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: ["string", "null"]
          format: date-time

    LiveSessionInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        scheduledAt:
          type: string
          format: date-time
          description: If provided and in the future, the session is created as "scheduled" instead of starting immediately.

    LiveSessionUpdate:
      type: object
      properties:
        title:
          type: string
        status:
          $ref: "#/components/schemas/LiveSessionStatus"
        scheduledAt:
          type: string
          format: date-time

    Conversation:
      type: object
      required: [userId, username, unreadCount]
      properties:
        userId:
          type: string
        username:
          type: string
        displayName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        lastMessage:
          type: ["string", "null"]
        lastMessageAt:
          type: ["string", "null"]
          format: date-time
        unreadCount:
          type: integer

    DirectMessage:
      type: object
      required: [id, senderId, recipientId, content, createdAt]
      properties:
        id:
          type: integer
        senderId:
          type: string
        recipientId:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        readAt:
          type: ["string", "null"]
          format: date-time

    MessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1

    BroadcastResult:
      type: object
      required: [recipientCount]
      properties:
        recipientCount:
          type: integer

    ChatMessage:
      type: object
      required: [id, userId, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        username:
          type: ["string", "null"]
        displayName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        content:
          type: ["string", "null"]
        mediaObjectPath:
          type: ["string", "null"]
        mediaType:
          type: ["string", "null"]
          enum: [image, audio, null]
        createdAt:
          type: string
          format: date-time
        readBy:
          type: array
          items:
            type: object
            required: [userId, username, displayName, avatarUrl]
            properties:
              userId:
                type: string
              username:
                type: ["string", "null"]
              displayName:
                type: ["string", "null"]
              avatarUrl:
                type: ["string", "null"]

    ChatMessageInput:
      type: object
      properties:
        content:
          type: string
        mediaObjectPath:
          type: string
        mediaType:
          type: string
          enum: [image, audio]

    ChatMessageRead:
      type: object
      required: [id, messageId, userId, createdAt]
      properties:
        id:
          type: integer
        messageId:
          type: integer
        userId:
          type: string
        createdAt:
          type: string
          format: date-time

    ChatMessageReadInput:
      type: object
      required: [messageId]
      properties:
        messageId:
          type: integer

    UploadUrlInput:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string

    UploadUrlResult:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string

    Comment:
      type: object
      required: [id, targetType, targetId, userId, username, content, upvoteCount, upvotedByMe, pinned, createdAt]
      properties:
        id:
          type: integer
        targetType:
          type: string
          enum: [media, live_session]
        targetId:
          type: integer
        userId:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        content:
          type: string
        upvoteCount:
          type: integer
        upvotedByMe:
          type: boolean
        pinned:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CommentInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1

    ArchiveSubscriptionStatus:
      type: object
      required: [active]
      properties:
        active:
          type: boolean

    CheckoutSessionResult:
      type: object
      required: [url]
      properties:
        url:
          type: string
          nullable: true
